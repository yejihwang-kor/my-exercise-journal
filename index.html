"그룹"):byId(e.member)?.name||"회원 정보 없음";let selectedGroupId="";const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmtDay(d){return new Date(d+'T12:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}function avatar(m){return `<div class="avatar" style="background:${m.color||'#e4e5d9'}">${m.image?`<img src="${m.image}">`:esc(m.initial||m.name.slice(-1))}</div>`}function setView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.getElementById('crumb').textContent=v==='ops'?'운영 관리':'회원 관리';if(v==='members')renderMembers()};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('todayBtn').onclick=document.getElementById('todayTop').onclick=()=>{current=new Date();selected=today;renderCalendar()};document.getElementById('prevMonth').onclick=()=>{current.setMonth(current.getMonth()-1);renderCalendar()};document.getElementById('nextMonth').onclick=()=>{current.setMonth(current.getMonth()+1);renderCalendar()};document.getElementById('newEvent').onclick=()=>eventModal();document.getElementById('addMember').onclick=()=>memberModal();
function renderCalendar(){const y=current.getFullYear(),m=current.getMonth();document.getElementById('monthTitle').textContent=`${y}년 ${m+1}월`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d),events=data.events.filter(e=>e.date===ds).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class="day ${d.getMonth()!==m?'dim':''} ${ds===today?'today':''} ${ds===selected?'selected':''}" data-date="${ds}"><div class="num">${d.getDate()}</div>${events.slice(0,2).map(e=>`<div class="event ${e.status==='취소'?'cancelled':''}">${esc(e.time)} ${esc(targetLabel(e))}</div>`).join('')}${events.length>2?`<div class="more">+${events.length-2}개 일정</div>`:''}</div>`}document.getElementById('calendarGrid').innerHTML=html;document.querySelectorAll('#calendarGrid .day').forEach(el=>el.onclick=()=>{selected=el.dataset.date;renderCalendar()});renderAgenda();renderChips()}
function renderAgenda(){let ev=data.events.filter(e=>e.date===selected).sort((a,b)=>a.time.localeCompare(b.time));document.getElementById('agendaTitle').textContent=fmtDay(selected);let done=ev.filter(e=>e.status==='완료').length,cancel=ev.filter(e=>e.status==='취소').length;document.getElementById('briefText').textContent=ev.length?`총 ${ev.length}개 수업 · 완료 ${done}개${cancel?` · 취소 ${cancel}개`:''}. ${ev.filter(e=>e.status==='예정').length?`${ev.filter(e=>e.status==='예정').length}개 수업을 준비해 주세요.`:'오늘 예정된 수업이 모두 마무리됐어요.'}`:'등록된 수업이 없습니다. 여유 시간을 활용해 회원 기록을 정리해 보세요.';document.getElementById('agendaList').innerHTML=ev.length?ev.map(e=>{let m=byId(e.member);return `<div class="agenda-item"><div class="time">${esc(e.time)}</div><div class="stripe ${e.status==='취소'?'cancel':''}"></div><div class="agenda-info"><button data-event="${e.id}"><b>${esc(targetLabel(e))}　${e.status==='취소'?'· 취소':''}</b></button><small>${esc(e.duration)}분 레슨${e.location?` · ${esc(e.location)}`:''} · ${esc(e.note||'레슨 내용 미기록')}</small></div></div>`}).join(''):'<div class="empty">이 날짜에 등록된 일정이 없습니다.</div>';document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{let e=data.events.find(x=>x.id===b.dataset.event);if(e.groupId){selectedGroupId=e.groupId;memberId=data.members.find(m=>m.groupId===e.groupId)?.id||memberId}else memberId=e.member;profileTab='records';setView('members')});let memo=document.getElementById('dayMemo');memo.value=data.dayNotes[selected]||'';memo.oninput=()=>{data.dayNotes[selected]=memo.value;save()}}
function renderChips(){document.getElementById('memberCount').textContent=`${data.members.length}명`;document.getElementById('memberChips').innerHTML=data.members.slice(0,8).map(m=>`<button class="member-chip" data-member="${m.id}">${avatar(m)}<span><b>${esc(m.name)}</b><small>${esc(m.goal)}</small></span></button>`).join('');document.querySelectorAll('.member-chip').forEach(b=>b.onclick=()=>{memberId=b.dataset.member;profileTab='records';setView('members')})}
function renderMembers(){let q=document.getElementById('memberSearch').value.toLowerCase();let list=data.members.filter(m=>m.name.toLowerCase().includes(q)&&(!selectedGroupId||m.groupId===selectedGroupId));let tree=data.groups.map(g=>{let members=data.members.filter(m=>m.groupId===g.id&&m.name.toLowerCase().includes(q));return `<div class="group-tree"><button class="member-row group-row ${selectedGroupId===g.id?'active':''}" data-group="${g.id}"><span class="ico">▸</span><div><b>${esc(g.name)}</b><small>${members.length}명 · ${esc(g.fixedSchedule||'고정 일정 미설정')}</small></div></button>${selectedGroupId===g.id?`<button class="btn group-add-btn" data-add-group="${g.id}">＋ 회원 추가</button><div class="group-schedule"><label>그룹 고정 레슨 일정</label><textarea id="groupSchedule-${g.id}" placeholder="예: 매주 월·수 18:00">${esc(g.fixedSchedule||'')}</textarea><button class="btn" data-save-group-schedule="${g.id}">일정 저장</button><button class="btn group-release-btn" data-release-group="${g.id}">그룹 해제</button></div>`:""}${members.map(m=>`<div class="member-row child-row ${memberId===m.id?'active':''}" data-id="${m.id}">${avatar(m)}<div><b>${esc(m.name)}</b><small>잔여 ${m.pass}회 · ${esc(m.goal)}</small></div></div>`).join('')}</div>`}).join('');let ungrouped=list.filter(m=>!m.groupId);document.getElementById('memberRows').innerHTML=tree+ungrouped.map(m=>`<div class="member-row ${memberId===m.id?'active':''}" data-id="${m.id}">${avatar(m)}<div><b>${esc(m.name)}</b><small>잔여 ${m.pass}회 · ${esc(m.goal)}</small></div></div>`).join('')||(!tree?'<div class="empty">검색 결과가 없습니다.</div>':'');document.querySelectorAll('.member-row[data-id]').forEach(r=>r.onclick=()=>{memberId=r.dataset.id;renderMembers()});document.querySelectorAll('.group-row').forEach(r=>r.onclick=()=>{selectedGroupId=r.dataset.group;renderMembers()});document.querySelectorAll('[data-add-group]').forEach(b=>b.onclick=()=>groupMembersModal(b.dataset.addGroup));document.querySelectorAll('[data-save-group-schedule]').forEach(b=>b.onclick=()=>{let g=groupById(b.dataset.saveGroupSchedule);g.fixedSchedule=document.getElementById('groupSchedule-'+g.id).value.trim();save();renderMembers()});document.querySelectorAll('[data-release-group]').forEach(b=>b.onclick=()=>releaseGroup(b.dataset.releaseGroup));let groupBtn=document.getElementById('addGroup');if(groupBtn)groupBtn.onclick=()=>{let name=prompt('그룹명을 입력해 주세요.');if(name&&name.trim()){data.groups.push({id:'g'+Date.now(),name:name.trim(),members:[]});save();renderMembers()}};let m=byId(memberId);if(!m){document.getElementById('profilePanel').innerHTML='<div class="empty">회원을 선택해 주세요.</div>';return}let evs=data.events.filter(e=>eventApplies(e,m)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));let panel=document.getElementById('profilePanel');panel.innerHTML=`<div class="profile-head">${avatar(m)}<div><h2>${esc(m.name)}</h2><p>${esc(m.goal)} · ${esc(m.level||'회원')}</p></div><div class="profile-actions"><button id="editMember">프로필 수정</button><button id="memberSchedule">＋ 일정 등록</button></div></div><div class="profile-grid"><div class="stat"><small>연락처</small><b>${esc(m.phone||'-')}</b></div><div class="stat"><small>잔여 수업</small><b>${esc(m.pass)}회</b></div><div class="stat"><small>이용권 만료</small><b>${esc(m.expiry||'-')}</b></div><div class="stat"><small>운동 목표</small><b>${esc(m.goal)}</b></div><div class="stat"><small>레벨</small><b>${esc(m.level||'-')}</b></div><div class="stat"><small>건강·주의사항</small><b>${esc(m.health||'없음')}</b></div></div><div class="schedule-note fixed-member-schedule"><label for="memberFixedSchedule">고정 레슨 일정</label><textarea id="memberFixedSchedule" placeholder="예: 매주 화·목 19:00">${esc(m.fixedSchedule||'')}</textarea><button class="btn" id="saveFixedSchedule" style="margin-top:8px">일정 저장</button></div><div class="profile-tabs"><button data-tab="records" class="${profileTab==='records'?'active':''}">레슨·출석 기록</button><button data-tab="calendar" class="${profileTab==='calendar'?'active':''}">회원 캘린더</button><button data-tab="body">회원 인바디 기록 추적</button></div><div id="memberContent"></div>`;document.getElementById('editMember').onclick=()=>memberModal(m);document.getElementById('saveFixedSchedule').onclick=()=>{m.fixedSchedule=document.getElementById('memberFixedSchedule').value.trim();save();renderMembers()};document.getElementById('memberSchedule').onclick=()=>eventModal(m.id);panel.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{profileTab=b.dataset.tab;renderMembers()});let content=document.getElementById('memberContent');if(profileTab==='body'){renderBodyTab(content,m)}else if(profileTab==='calendar'){content.innerHTML=`<div class="member-cal"><div class="cal-head"><h2>${current.getFullYear()}년 ${current.getMonth()+1}월</h2><div class="cal-controls"><button id="mprev">‹</button><button id="mnext">›</button></div></div><div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="miniGrid" class="grid mini-cal"></div><div class="subtle" style="margin-top:9px">날짜를 선택하면 해당 일자의 레슨 내용을 확인할 수 있어요.</div><div id="dateRecords"></div></div>`;let y=current.getFullYear(),mo=current.getMonth(),first=new Date(y,mo,1),start=new Date(y,mo,1-first.getDay()),html='';for(let i=0;i<35;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d),has=data.events.some(e=>eventApplies(e,m)&&e.date===ds),hasBody=data.bodyRecords.some(r=>r.member===m.id&&r.date===ds);html+=`<div class="day ${d.getMonth()!==mo?'dim':''} ${ds===selected?'selected':''} ${hasBody?'has-body':''}" data-date="${ds}"><div class="num">${d.getDate()}</div>${has?'<div class="event">수업</div>':''}${hasBody?'<div class="event body-marker">인바디</div>':''}</div>`}document.getElementById('miniGrid').innerHTML=html;document.querySelectorAll('#miniGrid .day').forEach(el=>el.onclick=()=>{selected=el.dataset.date;renderMembers()});document.getElementById('mprev').onclick=()=>{current.setMonth(current.getMonth()-1);renderMembers()};document.getElementById('mnext').onclick=()=>{current.setMonth(current.getMonth()+1);renderMembers()};let de=data.events.filter(e=>eventApplies(e,m)&&e.date===selected).sort((a,b)=>a.time.localeCompare(b.time));document.getElementById('dateRecords').innerHTML=de.length?de.map(e=>`<div class="record"><time>${esc(e.date)}<br>${esc(e.time)}</time><div><b>${esc(e.duration)}분 레슨 <span class="badge ${e.status==='취소'?'cancel':''}">${esc(e.status)}</span></b><p>${esc(e.note||'기록 내용 없음')}</p></div></div>`).join(''):'<div class="empty">선택한 날짜에 기록이 없습니다.</div>'}else{content.innerHTML=`<div class="record-list">${evs.length?evs.map(e=>`<div class="record"><time>${esc(e.date)}<br>${esc(e.time)}</time><div><b>${esc(e.duration)}분 레슨 <span class="badge ${e.status==='취소'?'cancel':''}">${esc(e.status)}</span></b><button class="record-actions" onclick="sessionModal(data.events.find(x=>x.id==='${e.id}'))">일지 작성 / 수정</button><p><b>수업 내용</b> · ${esc(e.content||e.note||'미기록')}</p>${e.other?`<p><b>기타 사항</b> · ${esc(e.other)}</p>`:''}${mediaMarkup(e.media)}</div></div>`).join(''):'<div class="empty">아직 레슨 기록이 없습니다.</div>'}</div>`}}
function releaseGroup(groupId){let g=groupById(groupId);if(!g)return;let members=data.members.filter(m=>m.groupId===groupId);if(!confirm("'"+g.name+" 그룹을 해제할까요? 그룹원은 개인회원으로 전환되고 그룹 수업 기록은 각 회원에게 보존됩니다."))return;members.forEach(m=>{m.groupId=''});let converted=[];data.events.forEach(e=>{if(e.groupId===groupId){members.forEach(m=>converted.push({...e,id:e.id+'-'+m.id,member:m.id,groupId:''}))}else converted.push(e)});data.events=converted;data.groups=data.groups.filter(x=>x.id!==groupId);selectedGroupId='';save();renderMembers();renderCalendar()}
function groupMembersModal(groupId){let g=groupById(groupId);if(!g)return;let host=document.getElementById('modalHost');let available=data.members.filter(m=>m.groupId!==groupId);host.innerHTML=`<div class="modal-back"><div class="modal"><h2>${esc(g.name)} 회원 추가</h2><p>그룹에 넣을 회원을 검색해 선택하세요. 다른 그룹 소속 회원은 이 그룹으로 이동합니다.</p><label class="search" style="margin-bottom:12px"><span>⌕</span><input id="groupMemberSearch" placeholder="회원 이름 검색"></label><div id="groupMemberOptions" style="max-height:320px;overflow:auto">${available.map(m=>`<label class="member-row" data-search="${esc(m.name.toLowerCase())}" style="cursor:pointer"><input type="checkbox" value="${m.id}">${avatar(m)}<span><b>${esc(m.name)}</b><small>${m.groupId?'다른 그룹에서 이동':'그룹 미지정'}</small></span></label>`).join('')||'<div class="empty">추가할 회원이 없습니다.</div>'}</div><div class="modal-actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="confirmGroupMembers">선택 회원 추가</button></div></div></div>`;host.querySelector('[data-close]').onclick=()=>host.innerHTML='';host.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))host.innerHTML=''};document.getElementById('groupMemberSearch').oninput=e=>{let q=e.target.value.toLowerCase();host.querySelectorAll('[data-search]').forEach(row=>row.classList.toggle('hidden',!row.dataset.search.includes(q)))};document.getElementById('confirmGroupMembers').onclick=()=>{let ids=[...host.querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);if(!ids.length){alert('추가할 회원을 선택해 주세요.');return}data.members.forEach(m=>{if(ids.includes(m.id))m.groupId=groupId});save();host.innerHTML='';selectedGroupId=groupId;renderMembers();renderCalendar()}}
document.getElementById('memberSearch').oninput=renderMembers;
function eventModal(member=''){let old=null;const host=document.getElementById('modalHost');host.innerHTML=`<div class="modal-back"><div class="modal"><h2>수업 등록</h2><p>수업을 등록하고 회원별 레슨 기록을 남겨보세요.</p><div class="form-grid"><div class="field full"><label>회원 선택 · 이름 검색</label><input id="memberPickSearch" placeholder="회원 이름을 입력해 검색"></div><div class="field full"><label>회원</label><select id="eventMember">${data.groups.map(g=>`<option value="group:${g.id}">${esc(g.name)} · 그룹 ${data.members.filter(m=>m.groupId===g.id).length}명</option>`).join('')}${data.members.map(m=>`<option value="${m.id}" ${m.id===member?'selected':''}>${esc(m.name)} · 잔여 ${m.pass}회</option>`).join('')}</select></div><div class="field"><label>날짜</label><input id="eventDate" type="date" value="${selected}"></div><div class="field"><label>시간</label><input id="eventTime" type="time" value="10:00"></div><div class="field full"><label>장소 (선택)</label><input id="eventLocation" placeholder="예: 한강공원, 스튜디오 A"></div><div class="field"><label>수업 시간</label><select id="eventDuration"><option>50</option><option>60</option><option>30</option><option>90</option></select></div><div class="field"><label>상태</label><select id="eventStatus"><option>예정</option><option>완료</option><option>취소</option></select></div><div class="field full"><label>레슨 내용 / 특이사항</label><textarea id="eventNote" placeholder="오늘의 운동 내용, 컨디션, 다음 수업 참고사항"></textarea></div></div><div class="modal-actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="saveEvent">수업 등록</button></div></div></div>`;host.querySelector('[data-close]').onclick=()=>host.innerHTML='';host.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))host.innerHTML=''};document.getElementById('memberPickSearch').oninput=e=>{let q=e.target.value.toLowerCase();let opts=[...document.getElementById('eventMember').options];opts.forEach(o=>o.hidden=!o.text.toLowerCase().includes(q));if(q){let first=opts.find(o=>!o.hidden);if(first)first.selected=true}};document.getElementById('saveEvent').onclick=()=>{let id='e'+Date.now(),target=document.getElementById('eventMember').value,isGroup=target.startsWith('group:');data.events.push({id,member:isGroup?'':target,groupId:isGroup?target.slice(6):'',location:document.getElementById('eventLocation').value.trim(),date:document.getElementById('eventDate').value,time:document.getElementById('eventTime').value,duration:Number(document.getElementById('eventDuration').value),status:document.getElementById('eventStatus').value,note:document.getElementById('eventNote').value.trim()});save();selected=document.getElementById('eventDate').value;current=new Date(selected+'T12:00');host.innerHTML='';renderCalendar();renderMembers()}}
function memberModal(m){let edit=!!m;let host=document.getElementById('modalHost');host.innerHTML=`<div class="modal-back"><div class="modal"><h2>${edit?'회원 정보 수정':'회원 추가'}</h2><p>회원 프로필과 운동 관리에 필요한 기본 정보를 입력하세요.</p><div class="form-grid"><div class="field"><label>이름</label><input id="mn" value="${esc(m?.name||'')}" placeholder="홍길동"></div><div class="field"><label>프로필 이미지</label><input id="mi" type="file" accept="image/*"></div><div class="field"><label>연락처</label><input id="mp" value="${esc(m?.phone||'')}" placeholder="010-0000-0000"></div><div class="field"><label>운동 레벨</label><input id="ml" value="${esc(m?.level||'초급')}" placeholder="초급"></div><div class="field full"><label>그룹</label><select id="mgroup"><option value="">그룹 없음</option>${data.groups.map(g=>`<option value="${g.id}" ${g.id===m?.groupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="field full"><label>운동 목표</label><input id="mg" value="${esc(m?.goal||'')}" placeholder="예: 체력 향상, 자세 교정"></div><div class="field full"><label>건강 상태 · 특이사항</label><textarea id="mh" placeholder="부상 이력, 주의할 동작">${esc(m?.health||'')}</textarea></div><div class="field"><label>잔여 수업</label><input id="mpp" type="number" value="${m?.pass??10}"></div><div class="field"><label>이용권 만료일</label><input id="me" type="date" value="${m?.expiry||''}"></div></div><div class="modal-actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="saveMember">${edit?'저장':'회원 추가'}</button></div></div></div>`;host.querySelector('[data-close]').onclick=()=>host.innerHTML='';host.querySelector('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))host.innerHTML=''};document.getElementById('saveMember').onclick=()=>{let file=document.getElementById('mi').files[0],apply=image=>{let obj={id:m?.id||'m'+Date.now(),name:document.getElementById('mn').value.trim(),phone:document.getElementById('mp').value,level:document.getElementById('ml').value,goal:document.getElementById('mg').value,groupId:document.getElementById('mgroup').value||'',health:document.getElementById('mh').value,pass:Number(document.getElementById('mpp').value),expiry:document.getElementById('me').value,color:m?.color||'#dce6d3',initial:(document.getElementById('mn').value.trim()||'?').slice(-1),image:image||m?.image};if(!obj.name){alert('회원 이름을 입력해 주세요.');return}if(edit)data.members=data.members.map(x=>x.id===m.id?obj:x);else{data.members.push(obj);memberId=obj.id}save();host.innerHTML='';renderMembers();renderCalendar()};if(file){let reader=new FileReader();reader.onload=()=>apply(reader.result);reader.readAsDataURL(file)}else apply(null)}}
function mediaMarkup(media=[]){if(!media.length)return '';return `<div class="media-list">${media.map(x=>x.type==='video'?`<a class="media-link" href="${x.data}" target="_blank">▶ ${esc(x.name||'동영상')}</a>`:`<img class="media-thumb" src="${x.data}" alt="${esc(x.name||'레슨 사진')}">`).join('')}</div>`}
function sessionModal(e){const host=document.getElementById('modalHost');host.innerHTML=`<div class="modal-back"><div class="modal"><h2>레슨 일지</h2><p>${esc(byId(e.member)?.name||'회원')} · ${esc(e.date)} ${esc(e.time)} 수업 기록</p><div class="form-grid"><div class="field full"><label>수업 내용</label><textarea id="sessionContent" placeholder="운동 종목, 세트·횟수, 수행 상태, 코칭 포인트 등을 기록하세요.">${esc(e.content||e.note||'')}</textarea></div><div class="field full"><label>기타 사항 / 컨디션 / 다음 수업 참고</label><textarea id="sessionOther" placeholder="컨디션, 통증, 전달사항, 다음 수업 계획 등">${esc(e.other||'')}</textarea></div><div class="field full"><label>사진 또는 동영상 첨부 (파일당 5MB 이하 권장)</label><input id="sessionMedia" type="file" accept="image/*,video/*" multiple>${mediaMarkup(e.media||[])}</div></div><div class="modal-actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="saveSession">일지 저장</button></div></div></div>`;host.querySelector('[data-close]').onclick=()=>host.innerHTML='';host.querySelector('.modal-back').onclick=x=>{if(x.target.classList.contains('modal-back'))host.innerHTML=''};document.getElementById('saveSession').onclick=async()=>{let files=[...document.getElementById('sessionMedia').files];if(files.some(f=>f.size>5*1024*1024)){alert('파일은 각각 5MB 이하로 선택해 주세요.');return}let media=[...(e.media||[])];for(const f of files){let dataUrl=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});media.push({name:f.name,type:f.type.startsWith('video/')?'video':'image',data:dataUrl})}e.content=document.getElementById('sessionContent').value.trim();e.note=e.content;e.other=document.getElementById('sessionOther').value.trim();e.media=media;save();host.innerHTML='';renderMembers();renderCalendar()}}
function renderBodyTab(content,m){let records=data.bodyRecords.filter(r=>r.member===m.id).sort((a,b)=>b.date.localeCompare(a.date));let selectedRecord=records.find(r=>r.date===selected);content.innerHTML=`<div class="member-cal"><div class="cal-head"><div><h2>${current.getFullYear()}년 ${current.getMonth()+1}월</h2><div class="subtle">날짜를 누르면 해당 일자의 인바디 기록을 확인하거나 추가할 수 있어요.</div></div><div class="cal-controls"><button id="bprev">‹</button><button id="bnext">›</button></div></div>${records.length?`<div class="body-summary">${['weight','bodyFat','muscle'].map((k,i)=>{let last=records.find(r=>r[k]),prev=records.slice(1).find(r=>r[k]),labels=['최근 체중','최근 체지방률','최근 골격근량'],unit=['kg','%','kg'];return `<div class="stat"><small>${labels[i]}</small><b>${last?last[k]+' '+unit[i]:'미기록'}</b>${last&&prev?`<small>이전 기록 대비 ${Number(last[k])-Number(prev[k])>0?'+':''}${(Number(last[k])-Number(prev[k])).toFixed(1)} ${unit[i]}</small>`:''}</div>`}).join('')}</div>`:''}<div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="bodyGrid" class="grid mini-cal"></div><div id="bodyDay"></div><div class="section-title"><h3>인바디 히스토리</h3><span>${records.length}건</span></div><div class="record-list">${records.length?records.map(r=>`<div class="record"><time>${esc(r.date)}</time><div><b>${r.weight?`체중 ${esc(r.weight)}kg · `:''}${r.bodyFat?`체지방률 ${esc(r.bodyFat)}% · `:''}${r.muscle?`골격근량 ${esc(r.muscle)}kg`:''}</b><p>${esc(r.note||'메모 없음')}</p>${mediaMarkup(r.media||[])}</div></div>`).join(''):'<div class="empty">등록된 인바디 기록이 없습니다.</div>'}</div></div>`;let y=current.getFullYear(),mo=current.getMonth(),first=new Date(y,mo,1),start=new Date(y,mo,1-first.getDay()),html='';for(let i=0;i<35;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d),has=records.some(r=>r.date===ds);html+=`<div class="day ${d.getMonth()!==mo?'dim':''} ${ds===selected?'selected':''} ${has?'has-body':''}" data-date="${ds}"><div class="num">${d.getDate()}</div>${has?'<div class="event body-marker">인바디</div>':''}</div>`}document.getElementById('bodyGrid').innerHTML=html;document.querySelectorAll('#bodyGrid .day').forEach(el=>el.onclick=()=>{selected=el.dataset.date;renderMembers()});document.getElementById('bprev').onclick=()=>{current.setMonth(current.getMonth()-1);renderMembers()};document.getElementById('bnext').onclick=()=>{current.setMonth(current.getMonth()+1);renderMembers()};const day=document.getElementById('bodyDay');day.innerHTML=`<div class="schedule-note"><label>${fmtDay(selected)} 인바디 기록</label>${selectedRecord?`<p>${selectedRecord.weight?`체중 ${esc(selectedRecord.weight)}kg · `:''}${selectedRecord.bodyFat?`체지방률 ${esc(selectedRecord.bodyFat)}% · `:''}${selectedRecord.muscle?`골격근량 ${esc(selectedRecord.muscle)}kg`:''}</p><p>${esc(selectedRecord.note||'')}</p>${mediaMarkup(selectedRecord.media||[])}`:'<p>이 날짜에 저장된 인바디 기록이 없습니다.</p>'}<button class="btn" id="bodyAdd" style="margin-top:10px">${selectedRecord?'기록 수정':'＋ 인바디 기록 추가'}</button></div>`;document.getElementById('bodyAdd').onclick=()=>bodyModal(m,selected,selectedRecord)}
function bodyModal(m,date,record){let host=document.getElementById('modalHost');host.innerHTML=`<div class="modal-back"><div class="modal"><h2>인바디 기록 ${record?'수정':'추가'}</h2><p>${esc(m.name)} · ${esc(date)}</p><div class="form-grid"><div class="field"><label>체중 (kg)</label><input id="bw" type="number" step="0.1" value="${record?.weight||''}"></div><div class="field"><label>체지방률 (%)</label><input id="bf" type="number" step="0.1" value="${record?.bodyFat||''}"></div><div class="field"><label>골격근량 (kg)</label><input id="bm" type="number" step="0.1" value="${record?.muscle||''}"></div><div class="field full"><label>메모</label><textarea id="bn" placeholder="측정 환경, 목표, 컨디션 등을 기록하세요.">${esc(record?.note||'')}</textarea></div><div class="field full"><label>인바디 결과 이미지</label><input id="bi" type="file" accept="image/*">${record?.media?.length?mediaMarkup(record.media):''}</div></div><div class="modal-actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="saveBody">기록 저장</button></div></div></div>`;host.querySelector('[data-close]').onclick=()=>host.innerHTML='';host.querySelector('.modal-back').onclick=x=>{if(x.target.classList.contains('modal-back'))host.innerHTML=''};document.getElementById('saveBody').onclick=()=>{let f=document.getElementById('bi').files[0];if(f&&f.size>5*1024*1024){alert('이미지는 5MB 이하로 선택해 주세요.');return}let apply=image=>{let r=record||{id:'b'+Date.now(),member:m.id,date,media:[]};r.weight=document.getElementById('bw').value;r.bodyFat=document.getElementById('bf').value;r.muscle=document.getElementById('bm').value;r.note=document.getElementById('bn').value.trim();if(image)r.media=[{name:f.name,type:'image',data:image}];if(!record)data.bodyRecords.push(r);save();host.innerHTML='';renderMembers()};if(f){let fr=new FileReader();fr.onload=()=>apply(fr.result);fr.readAsDataURL(f)}else apply(null)}}

renderCalendar();renderMembers();
</script></body></html>
