<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="brandmark" id="brandSportIcon">⚽</div><span>나의 운동 일지</span></div><div class="top-right"><span class="welcome" id="welcomeText">나의 풋살 기록</span><button class="icon-btn" id="settingsBtn" aria-label="설정" title="운동 종목 설정">⚙</button></div></header>
  <section class="hero"><div><div class="eyebrow">MY TRAINING JOURNAL</div><h1 id="sportTitle">나의 풋살 일지</h1><p>배운 걸 기록하면, 다음 연습이 더 선명해져요.</p></div><button type="button" class="primary" id="newBtn"><span>＋</span>새 일지 쓰기</button></section>
  <section class="stats"><div class="stat"><div class="stat-icon" id="sportStatIcon">⚽</div><div><div class="stat-label">전체 기록</div><strong id="totalCount">0</strong><small>회</small></div></div><div class="stat"><div class="stat-icon">🔥</div><div><div class="stat-label">이번 달 훈련</div><strong id="monthCount">0</strong><small>회</small></div></div><div class="stat"><div class="stat-icon">🎬</div><div><div class="stat-label">저장한 영상</div><strong id="videoCount">0</strong><small>개</small></div></div></section>
  <main class="content"><section class="panel"><div class="panel-head"><div class="panel-title" id="mainTitle">훈련 기록</div><div class="view-switch"><button class="active" data-view="calendar">캘린더</button><button data-view="list">날짜별</button></div></div><div id="calendarView" class="calendar"></div><div class="list-options hidden" id="listOptions"><span>목록 보기</span><div class="view-switch"><button class="active" data-group="recent">최신순</button><button data-group="category">카테고리별</button></div></div><div class="entry-list" id="entryList"></div></section><aside class="right-col"><section class="panel side-panel"><div class="side-head"><strong>이번 주</strong><span id="weekRange"></span></div><div class="week-row" id="weekRow"></div></section><section class="quote"><div class="eyebrow">KEEP IT IN PLAY</div><p>잘한 플레이도, 아쉬운 플레이도<br>적어두면 다음의 내 실력이 돼.</p><small>오늘의 나에게 남기는 한마디</small></section><section class="tip"><strong>💡 작은 팁</strong><p>훈련 이름과 함께 “어떤 점이 어려웠는지”도 적어두면 혼자 연습할 때 더 도움이 돼요.</p></section></aside></main>

<script>
const DB_NAME='touchlog-db',STORE='journals',FALLBACK_KEY='touchlog-journals',PREF_KEY='my-exercise-journal-preferences';
const $=s=>document.querySelector(s),fmt=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},dateObj=s=>new Date(s+'T12:00:00'),weekday=['일','월','화','수','목','금','토'];
const sports=[['축구','⚽','축구'],['풋살','⚽︎','풋살'],['야구','⚾','야구'],['농구','🏀','농구'],['테니스','🎾','테니스'],['배드민턴','🏸','배드민턴'],['러닝','🏃','러닝'],['수영','🏊','수영'],['탁구','🏓','탁구'],['골프','⛳','골프'],['자전거','🚴','자전거'],['보드','🛹','보드'],['헬스','🏋️','헬스'],['필라테스','🤸','필라테스'],['요가','🧘','요가'],['복싱','🥊','복싱'],['등산','🥾','등산'],['스키·스노보드','🏂','스키·스노보드'],['클라이밍','🧗','클라이밍'],['운동','💪','운동']];
let db,storageMode='idb',entries=[],view='calendar',listGrouping='recent',cursor=new Date(2026,10,1),selectedDate=fmt(new Date()),sport='축구';
function loadPreferences(){try{const saved=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');if(sports.some(x=>x[0]===saved.sport))sport=saved.sport}catch(e){}}
function sportInfo(){return sports.find(x=>x[0]===sport)||sports[0]}
function sportIconMarkup(name){if(name==='풋살')return '<svg class="sport-icon-svg" viewBox="0 0 32 32" role="img" aria-label="풋살공"><circle cx="16" cy="16" r="14" fill="#f8fbf2" stroke="#26764f" stroke-width="1.6"/><path d="m16 9 4 3-1.5 5h-5L12 12z" fill="#26764f"/><path d="m16 9 .3-6m3.7 9 6-1m-7.5 6 3.2 5m-8.2-5-3.2 5M12 12 6 11m6 1-4-5m12 5 4-5m-10 11-6 3m11-3 6 3" fill="none" stroke="#397baf" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><circle cx="16" cy="16" r="14" fill="none" stroke="#26764f" stroke-width="1.6"/></svg>';return sports.find(x=>x[0]===name)?.[1]||'⚽'}
function applySport(){const [name,icon,title]=sportInfo();document.title='나의 운동 일지';$('#sportTitle').textContent=`나의 ${title} 일지`;$('#welcomeText').textContent=`나의 ${title} 기록`;$('#brandSportIcon').innerHTML=sportIconMarkup(name);$('#sportStatIcon').innerHTML=sportIconMarkup(name);document.querySelectorAll('.brandmark').forEach(el=>el.setAttribute('aria-label',`${name} 아이콘`))}
function entryTypeLabel(type){return ['수업','단체훈련','개인훈련','매치'].includes(type)?type:'수업'}
function entryTypeClass(type){return entryTypeLabel(type)==='단체훈련'?'group':entryTypeLabel(type)==='개인훈련'?'individual':entryTypeLabel(type)==='매치'?'match':'class'}
function openDb(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE,{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function all(){if(storageMode==='local')return Promise.resolve(JSON.parse(localStorage.getItem(FALLBACK_KEY)||'[]'));return new Promise((res,rej)=>{const q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function put(v){if(storageMode==='local'){if(v.video)throw new Error('video-storage-unavailable');const rows=JSON.parse(localStorage.getItem(FALLBACK_KEY)||'[]'),i=rows.findIndex(x=>x.id===v.id);if(i<0)rows.push(v);else rows[i]=v;localStorage.setItem(FALLBACK_KEY,JSON.stringify(rows));return Promise.resolve()}return new Promise((res,rej)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).put(v);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function del(id){if(storageMode==='local'){localStorage.setItem(FALLBACK_KEY,JSON.stringify(JSON.parse(localStorage.getItem(FALLBACK_KEY)||'[]').filter(x=>x.id!==id)));return Promise.resolve()}return new Promise((res,rej)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){entries.sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));$('#totalCount').textContent=entries.length;const m=fmt(new Date()).slice(0,7);$('#monthCount').textContent=entries.filter(e=>e.date.startsWith(m)).length;$('#videoCount').textContent=entries.filter(e=>e.video).length;renderCalendar();renderList();renderWeek()}
function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),offset=first.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),today=fmt(new Date());let html=`<div class="month-nav"><button id="prevMonth">‹</button><span>${y}년 ${m+1}월</span><button id="nextMonth">›</button></div><div class="week">${weekday.map(x=>`<div>${x}</div>`).join('')}</div><div class="days">`;for(let i=0;i<42;i++){let d=i-offset+1,dt,cls='day';if(d<1){dt=new Date(y,m-1,prev+d);cls+=' muted'}else if(d>days){dt=new Date(y,m+1,d-days);cls+=' muted'}else dt=new Date(y,m,d);const key=fmt(dt),types=[...new Set(entries.filter(e=>e.date===key).map(e=>entryTypeClass(e.entryType)))];if(key===today)cls+=' today';if(key===selectedDate)cls+=' selected';if(types.length)cls+=' has';const dots=types.map(type=>`<i class="dot-${type}"></i>`).join('');html+=`<div class="${cls}" data-date="${key}"><span>${dt.getDate()}</span><div class="day-dots">${dots}</div></div>`}html+='</div><div class="calendar-legend"><span><i class="dot-class"></i> 수업</span><span><i class="dot-group"></i> 단체훈련</span><span><i class="dot-individual"></i> 개인훈련</span><span><i class="dot-match"></i> 매치</span></div>';$('#calendarView').innerHTML=html;$('#prevMonth').onclick=()=>{cursor=new Date(y,m-1,1);renderCalendar()};$('#nextMonth').onclick=()=>{cursor=new Date(y,m+1,1);renderCalendar()};document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;renderCalendar();renderList()})}
function entryCardMarkup(e){const day=e.date.slice(-2);return `<article class="entry-card" data-id="${e.id}"><div class="entry-datebox type-${entryTypeClass(e.entryType)}"><b>${day}</b><small>${entryTypeLabel(e.entryType)}</small></div><div class="entry-info"><strong>${esc(e.title||'오늘의 훈련')}</strong><p>${esc((e.drills||[]).map(x=>x.name).filter(Boolean).join(' · ')||e.feeling||'기록을 확인해보세요')}</p></div><div class="entry-arrow">›</div></article>`}
function renderList(){const host=$('#entryList');let arr=entries;if(view==='calendar')arr=entries.filter(e=>e.date===selectedDate);if(!arr.length){host.innerHTML=`<div class="empty"><div class="ball">${view==='calendar'?'📅':'⚽'}</div>${view==='calendar'?(selectedDate===fmt(new Date())?'오늘은':'선택한 날짜에는')+' 아직 기록이 없어요.':'아직 기록이 없어요.'}<br><span style="font-size:11px">첫 훈련 일지를 남겨보세요!</span></div>`;return}if(view==='list'&&listGrouping==='category'){const types=['수업','단체훈련','개인훈련','매치'];host.innerHTML=types.map(type=>{const group=arr.filter(e=>entryTypeLabel(e.entryType)===type);if(!group.length)return '';const typeClass=entryTypeClass(type);return `<div class="category-heading type-${typeClass}"><span class="category-color"></span>${type}<small>${group.length}개</small></div>${group.map(entryCardMarkup).join('')}`}).join('')}else{const grouped={};arr.forEach(e=>(grouped[e.date]??=[]).push(e));host.innerHTML=Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).map(d=>`<div class="list-date">${dateObj(d).getFullYear()}년 ${dateObj(d).getMonth()+1}월 ${dateObj(d).getDate()}일 · ${weekday[dateObj(d).getDay()]}요일</div>${grouped[d].map(entryCardMarkup).join('')}`).join('')}document.querySelectorAll('.entry-card').forEach(el=>el.onclick=()=>showDetail(el.dataset.id))}
function renderWeek(){let now=new Date(),s=new Date(now);s.setDate(now.getDate()-((now.getDay()+6)%7));const end=new Date(s);end.setDate(s.getDate()+6);$('#weekRange').textContent=`${s.getMonth()+1}.${s.getDate()} – ${end.getMonth()+1}.${end.getDate()}`;$('#weekRow').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);let key=fmt(d),done=entries.some(e=>e.date===key);return `<div class="week-item ${key===fmt(now)?'current':''} ${done?'done':''}"><small>${weekday[d.getDay()]}</small><b>${d.getDate()}</b></div>`}).join('')}
document.querySelectorAll('.view-switch button[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.view-switch button[data-view]').forEach(x=>x.classList.toggle('active',x===b));$('#mainTitle').textContent=view==='calendar'?'훈련 기록':'전체 일지';$('#calendarView').classList.toggle('hidden',view!=='calendar');$('#listOptions').classList.toggle('hidden',view!=='list');renderList()});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{listGrouping=b.dataset.group;document.querySelectorAll('[data-group]').forEach(x=>x.classList.toggle('active',x===b));renderList()});
function openForm(entry){const editing=!!entry;const e=entry||{date:selectedDate,title:'',category:`${sportInfo()[2]} 레슨`,drills:[{name:'',memo:''}],feeling:'',video:null};$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h2>${editing?'일지 수정':'새 훈련 일지'}</h2><button class="icon-btn" id="closeModal">×</button></div><form class="form" id="journalForm"><div class="field-row"><div class="field"><label>날짜</label><input name="date" type="date" value="${esc(e.date)}" required></div><div class="field"><label>훈련 종류</label><input name="category" value="${esc(e.category||`${sportInfo()[2]} 레슨`)}" placeholder="예: ${sportInfo()[2]} 레슨"></div></div><div class="field"><label>기록 구분</label><select name="entryType"><option value="수업" ${entryTypeLabel(e.entryType)==='수업'?'selected':''}>수업</option><option value="단체훈련" ${e.entryType==='단체훈련'?'selected':''}>단체훈련</option><option value="개인훈련" ${e.entryType==='개인훈련'?'selected':''}>개인훈련</option><option value="매치" ${e.entryType==='매치'?'selected':''}>매치</option></select></div><div class="field"><label>오늘의 제목</label><input name="title" value="${esc(e.title)}" placeholder="예: 오늘 배운 기술과 동작" required></div><div class="training-head"><strong>오늘 배운 훈련</strong><button type="button" id="addDrill">＋ 훈련 추가</button></div><div id="drills">${(e.drills?.length?e.drills:[{name:'',memo:''}]).map(drillRow).join('')}</div><div class="field" style="margin-top:20px"><label>느낀 점 · 다음 목표</label><textarea name="feeling" placeholder="오늘 잘된 점, 어려웠던 점, 다음 시간까지 해보고 싶은 연습을 적어보세요.">${esc(e.feeling||'')}</textarea></div><div class="field"><label>레슨 영상</label><div class="video-zone"><input id="videoFile" type="file" accept="video/*"><small>${e.video?'기존 영상이 저장되어 있어요. 새 영상을 선택하면 교체됩니다.':''} 영상은 이 기기에 저장됩니다. 큰 영상은 저장 공간을 많이 사용할 수 있어요.</small></div></div><div class="form-actions"><button type="button" class="secondary" id="cancelForm">취소</button><button class="primary save">${editing?'수정 저장':'일지 저장'}</button></div></form></section></div>`;$('#closeModal').onclick=closeModal;$('#cancelForm').onclick=closeModal;$('#overlay').onclick=ev=>{if(ev.target.id==='overlay')closeModal()};$('#addDrill').onclick=()=>{$('#drills').insertAdjacentHTML('beforeend',drillRow({name:'',memo:''}));bindRemove()};bindRemove();$('#journalForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.target),rows=[...document.querySelectorAll('.training-row')].map(r=>({name:r.querySelector('[name=drillName]').value.trim(),memo:r.querySelector('[name=drillMemo]').value.trim()})).filter(x=>x.name||x.memo);const file=$('#videoFile').files[0];if(file&&file.size>250*1024*1024){toast('영상은 250MB 이하로 선택해주세요.');return}const obj={id:e.id||crypto.randomUUID(),date:fd.get('date'),category:fd.get('category').trim(),entryType:entryTypeLabel(fd.get('entryType')),createdAt:e.createdAt||Date.now(),title:fd.get('title').trim(),drills:rows,feeling:fd.get('feeling').trim(),video:file||e.video||null,videoName:file?.name||e.videoName||''};try{await put(obj);entries=await all();selectedDate=obj.date;cursor=dateObj(obj.date);closeModal();render();toast('일지가 저장됐어요. 다음 연습 때 다시 꺼내보세요!')}catch(err){toast('저장 공간이 부족해요. 영상 크기를 줄여 다시 시도해주세요.')}}}
function drillRow(d){return `<div class="training-row"><input name="drillName" value="${esc(d.name)}" placeholder="훈련 이름"><input name="drillMemo" value="${esc(d.memo)}" placeholder="방법이나 코칭 포인트"><button type="button" class="remove-row" aria-label="훈련 삭제">×</button></div>`}function bindRemove(){document.querySelectorAll('.remove-row').forEach(b=>b.onclick=()=>{if(document.querySelectorAll('.training-row').length>1)b.parentElement.remove();else{b.parentElement.querySelectorAll('input').forEach(i=>i.value='')}})}function closeModal(){const player=$('#videoPlayer');if(player?.src)URL.revokeObjectURL(player.src);$('#modalRoot').innerHTML=''}
function showDetail(id){const e=entries.find(x=>x.id===id);if(!e)return;let videoUrl=e.video?URL.createObjectURL(e.video):null;$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h2>훈련 일지</h2><button class="icon-btn" id="closeModal">×</button></div><div class="detail" data-type="${entryTypeClass(e.entryType)}"><div class="detail-meta">${e.date}<span class="category-pill">${entryTypeLabel(e.entryType)}</span>${esc(e.category||'훈련')}</div><h2>${esc(e.title)}</h2>${e.video?`<video id="videoPlayer" class="video-player" src="${videoUrl}" controls playsinline></video>`:''}${e.drills?.length?`<div class="detail-block"><h3>오늘 배운 훈련</h3>${e.drills.map((d,i)=>`<div class="drill"><i>${i+1}</i><div><b>${esc(d.name||'훈련')}</b>${d.memo?`<div style="color:#77827a;margin-top:4px">${esc(d.memo)}</div>`:''}</div></div>`).join('')}</div>`:''}${e.feeling?`<div class="detail-block"><h3>느낀 점 · 다음 목표</h3><p>${esc(e.feeling)}</p></div>`:''}<div class="detail-actions"><button class="secondary danger" id="deleteEntry">삭제</button><button class="secondary" id="editEntry">수정하기</button></div></div></section></div>`;$('#closeModal').onclick=closeModal;$('#overlay').onclick=ev=>{if(ev.target.id==='overlay')closeModal()};$('#editEntry').onclick=()=>openForm(e);$('#deleteEntry').onclick=async()=>{if(confirm('이 일지를 삭제할까요? 영상도 함께 삭제됩니다.')){await del(e.id);entries=await all();closeModal();render();toast('일지를 삭제했어요.')}}}
function openSettings(){const [name,icon,title]=sportInfo();$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h2>운동 종목 설정</h2><button class="icon-btn" id="closeModal">×</button></div><form class="form" id="settingsForm"><div class="field"><label for="sportSelect">내 운동 종목</label><select id="sportSelect" name="sport">${sports.map(([n,i])=>`<option value="${n}" ${n===sport?'selected':''}>${i} ${n}</option>`).join('')}</select></div><div class="tip" id="sportPreview"><strong style="font-size:14px">${sportIconMarkup(name)}　나의 ${title} 일지</strong><p>선택한 종목과 아이콘이 메인 화면에 표시됩니다.</p></div><div class="form-actions"><button type="button" class="secondary" id="cancelSettings">취소</button><button class="primary save">설정 저장</button></div></form></section></div>`;$('#closeModal').onclick=closeModal;$('#cancelSettings').onclick=closeModal;$('#overlay').onclick=ev=>{if(ev.target.id==='overlay')closeModal()};$('#sportSelect').onchange=ev=>{const chosen=sports.find(x=>x[0]===ev.target.value)||sports[0];$('#sportPreview').innerHTML=`<strong style="font-size:14px">${sportIconMarkup(chosen[0])}　나의 ${chosen[2]} 일지</strong><p>선택한 종목과 아이콘이 메인 화면에 표시됩니다.</p>`};$('#settingsForm').onsubmit=ev=>{ev.preventDefault();sport=$('#sportSelect').value;try{localStorage.setItem(PREF_KEY,JSON.stringify({sport}))}catch(e){toast('브라우저에 설정을 저장할 수 없어요.')}applySport();closeModal();toast('운동 종목 설정을 저장했어요.')}}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}$('#newBtn').addEventListener('click',()=>{try{openForm()}catch(err){console.error('새 일지 작성창 열기 실패:',err);toast('작성창을 열지 못했어요. 페이지를 새로고침해주세요.')}});$('#settingsBtn').onclick=openSettings;
(async()=>{loadPreferences();applySport();try{db=await openDb();entries=await all()}catch(e){try{storageMode='local';entries=await all();toast('텍스트 일지는 이 브라우저에 저장돼요. 동영상 저장은 사용할 수 없어요.')}catch(storageError){entries=[];toast('브라우저 저장소를 사용할 수 없어요. 브라우저 설정을 확인해주세요.')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(reg=>reg.update()).catch(()=>{})})();
</script>
</body></html>
